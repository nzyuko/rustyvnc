[package]
name = "rustyvnc-client"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = "z"
strip = true
